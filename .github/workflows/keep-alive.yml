name: Keep Alive

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Commit keep-alive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(date -u)" > .keep-alive
          git add .keep-alive
          git commit -m "chore: keep-alive para manter workflows ativos"
          git push origin main

