name: Atualizar Videos YouTube

on:
  schedule:
    - cron: "5 9 * * *"
    - cron: "5 10 * * *"
    - cron: "5 11 * * *"
    - cron: "5 12 * * *"
    - cron: "5 13 * * *"
    - cron: "5 14 * * *"
    - cron: "5 15 * * *"
    - cron: "5 16 * * *"
    - cron: "5 17 * * *"
    - cron: "5 18 * * *"
    - cron: "5 19 * * *"
    - cron: "5 20 * * *"
    - cron: "5 21 * * *"
    - cron: "5 22 * * *"
    - cron: "5 23 * * *"
    - cron: "5 0 * * *"
    - cron: "5 1 * * *"
    - cron: "5 2 * * *"
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Buscar videos
        run: python fetch_youtube.py
      - name: Commit videos.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Atualizar videos $(date '+%d/%m/%Y %H:%M')" || echo "Nada"
          git push || echo "Push falhou"
