name: Atualizar Videos YouTube

on:
  schedule:
    - cron: "0 9-23 * * *"
    - cron: "0 0,1,2 * * *"
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Buscar videos
        run: python fetch_youtube.py
      - name: Commit videos.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Atualizar videos $(date '+%d/%m/%Y %H:%M')" || echo "Nada"
          git push || echo "Push falhou"
