on:
  schedule:
    # Roda todo dia Ã s 07:00 (horÃ¡rio de BrasÃ­lia = 10:00 UTC)
    - cron: "0 10 * * *"

  # Permite rodar manualmente pelo painel do GitHub
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # NecessÃ¡rio para fazer commit do videos.json

    steps:
      - name: Clonar repositÃ³rio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Executar script de busca
        run: python fetch_youtube.py

      - name: Commit e push do videos.json atualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --staged --quiet || git commit -m "ð¬ Atualizar vÃ­deos YouTube â $(date '+%d/%m/%Y %H:%M')"
          git push
