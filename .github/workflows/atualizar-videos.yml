name: Atualizar Videos YouTube

on:
  schedule:
    - cron: "5 9 * * *"    # 06:05 Brasilia
    - cron: "5 10 * * *"   # 07:05 Brasilia
    - cron: "5 11 * * *"   # 08:05 Brasilia
    - cron: "5 12 * * *"   # 09:05 Brasilia
    - cron: "5 13 * * *"   # 10:05 Brasilia
    - cron: "5 14 * * *"   # 11:05 Brasilia
    - cron: "5 15 * * *"   # 12:05 Brasilia
    - cron: "5 16 * * *"   # 13:05 Brasilia
    - cron: "5 17 * * *"   # 14:05 Brasilia
    - cron: "5 18 * * *"   # 15:05 Brasilia
    - cron: "5 19 * * *"   # 16:05 Brasilia
    - cron: "5 20 * * *"   # 17:05 Brasilia
    - cron: "5 21 * * *"   # 18:05 Brasilia
    - cron: "5 22 * * *"   # 19:05 Brasilia
    - cron: "5 23 * * *"   # 20:05 Brasilia
    - cron: "5 0 * * *"    # 21:05 Brasilia
    - cron: "5 1 * * *"    # 22:05 Brasilia
    - cron: "5 2 * * *"    # 23:05 Brasilia
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Buscar videos
        run: python fetch_youtube.py
      - name: Commit videos.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Atualizar videos $(date '+%d/%m/%Y %H:%M')" || echo "Nada"
          git push || echo "Push falhou"
